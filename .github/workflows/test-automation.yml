# TR: GitHub Actions İş Akışı - Test Otomasyonu
# EN: GitHub Actions Workflow - Test Automation
name: Test Automation

on:
  # TR: 'main' veya 'master' branşlarına push yapıldığında çalışır.
  # EN: Triggers on push to 'main' or 'master' branches.
  push:
    branches:
      - main
      - master
  # TR: 'main' veya 'master' branşları için Pull Request açıldığında çalışır.
  # EN: Triggers when a Pull Request is opened for 'main' or 'master' branches.
  pull_request:
    branches:
      - main
      - master
  # TR: Manuel olarak GitHub üzerinden çalıştırılabilmesini sağlar.
  # EN: Allows manual execution from the GitHub interface.
  workflow_dispatch:

jobs:
  api-tests:
    name: API Tests
    # TR: Testlerin çalışacağı işletim sistemi (Ubuntu).
    # EN: The operating system where tests will run (Ubuntu).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pytest requests
          fi

      - name: Run API tests with JUnit report
        run: |
          mkdir -p reports
          # TR: api klasöründeki testleri çalıştırır ve JUnit XML raporu oluşturur.
          # EN: Runs tests in the api folder and generates a JUnit XML report.
          pytest api -v --junitxml=reports/api-junit.xml

      - name: Upload API JUnit report
        uses: actions/upload-artifact@v4
        # TR: Testler başarısız olsa bile raporun her zaman yüklenmesini sağlar.
        # EN: Ensures the report is always uploaded even if tests fail.
        if: always()
        with:
          name: api-junit-report
          path: reports/api-junit.xml

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest

    env:
      # TR: UI testlerinin arayüzsüz (headless) modda çalışmasını zorunlu kılar.
      # EN: Forces UI tests to run in headless mode.
      HEADLESS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UI dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pytest selenium
          fi

      - name: Run UI tests with JUnit report
        run: |
          mkdir -p reports
          # TR: ui klasöründeki testleri çalıştırır.
          # EN: Runs tests in the ui folder.
          pytest ui -v --junitxml=reports/ui-junit.xml

      - name: Upload UI JUnit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-junit-report
          path: reports/ui-junit.xml