name: Newman API Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newman-api-tests:
    name: Run Postman collection with Newman
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Install Newman and HTML reporter
        run: |
          npm install -g newman@6.2.3
          npm install -g newman-reporter-html@1.0.5

      - name: Create reports folder
        run: mkdir -p reports

      - name: Run Newman collection
        run: |
          newman run api/newman/collection/collection.json \
            -e api/newman/environment/environment.json \
            -r cli,html,junit \
            --reporter-html-export reports/newman-report.html \
            --reporter-junit-export reports/newman-report.xml

      - name: Verify Newman reports exist
        if: always()
        run: |
          test -s reports/newman-report.html
          test -s reports/newman-report.xml

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: |
            reports/newman-report.html
            reports/newman-report.xml
          if-no-files-found: error
