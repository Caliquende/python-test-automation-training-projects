[pytest]
# TR: UI klasörü içinde testlerin aranacağı klasör.
# EN: Directory to search for tests within the UI folder.
testpaths = tests

python_files = test_*.py
python_functions = test_*
addopts = -v

# TR: Proje kök dizinini Python yoluna ekler.
# EN: Adds the project root directory to the path.
pythonpath = ../..

markers =
    regression: marks regression tests
    smoke: marks smoke tests
