[pytest]
# TR: Testlerin aranacağı klasör yollarını belirtir.
# EN: Specifies the directory paths where tests will be searched.
testpaths = api/tests ui/tests

# TR: Pytest'in hangi dosyaları test dosyası olarak kabul edeceğini tanımlar.
# EN: Defines which files Pytest should consider as test files.
python_files = test_*.py

# TR: Pytest'in hangi fonksiyonları test fonksiyonu olarak kabul edeceğini tanımlar.
# EN: Defines which functions Pytest should consider as test functions.
python_functions = test_*

# TR: Komut satırı argümanları (v: verbose/detaylı raporlama).
# EN: Command-line arguments (v: verbose/detailed reporting).
addopts = -v

# TR: Proje kök dizinini Python yoluna (PYTHONPATH) ekler, böylece 'api' ve 'ui' paketleri import edilebilir.
# EN: Adds the project root directory to the pythonpath so 'api' and 'ui' packages can be imported.
pythonpath = .

# TR: Testleri gruplandırmak için kullanılan özel etiketler (markers).
# EN: Custom markers used for grouping tests.
markers =
    smoke: fast critical checks for core functionality (Kritik çekirdek fonksiyon testleri)
    regression: broader tests used to verify existing behavior after changes (Kapsamlı regresyon testleri)