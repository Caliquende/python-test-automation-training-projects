[pytest]
# TR: API klasörü içinde testlerin aranacağı klasör.
# EN: Directory to search for tests within the API folder.
testpaths = tests

python_files = test_*.py
python_functions = test_*
addopts = -v

# TR: Proje kök dizinini Python yoluna ekler.
# EN: Adds the project root directory to the path.
pythonpath = ../..

markers =
    smoke: marks fast critical API checks
    regression: marks broader API regression checks
